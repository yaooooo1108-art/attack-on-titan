<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
	
    <title>捐款網站</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">捐款平台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                  
                   
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="text-center">
            <h1>支持軍團 保衛家園</h1>
            <p class="lead">您的每一筆捐款都將為我們牆外調查的一份力量。</p>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h4 class="card-title text-center">捐款表單</h4>
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">姓名</label>
                                <input type="text" class="form-control" id="name" placeholder="請輸入您的姓名" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">電子郵件</label>
                                <input type="email" class="form-control" id="email" placeholder="請輸入您的電子郵件" required>
                            </div>
                            <div class="mb-3">
                                <label for="amount" class="form-label">捐款金額 (NT$)</label>
                                <input type="number" class="form-control" id="amount" min="1" placeholder="請輸入捐款金額" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">留言 (可不填)</label>
                                <textarea class="form-control" id="message" rows="3" placeholder="有任何話想對我們說嗎？"></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">立即捐款</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        <p>© 2025 晉級的巨人基金會. 保留所有權利。</p>
    </footer>
  </body>
</html>
